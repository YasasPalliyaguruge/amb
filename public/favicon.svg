<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AMB favicon</title>
  <desc id="desc">Monogram favicon for Aadhila M. Biswas</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6eee6"/>
      <stop offset="100%" stop-color="#ead7c6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="#b85f3d" stroke-width="4" opacity="0.45"/>
  <text x="64" y="77" text-anchor="middle" font-size="48" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#2b221d" letter-spacing="2">AMB</text>
</svg>
