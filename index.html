    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('amb-resolved-theme-cache-v1');
          if (!raw) return;

          var cachedTheme = JSON.parse(raw);
          if (!cachedTheme || !cachedTheme.cssVars) return;

          var root = document.documentElement;
          Object.entries(cachedTheme.cssVars).forEach(function (entry) {
            root.style.setProperty(entry[0], entry[1]);
          });

          if (cachedTheme.surfaceMode) {
            root.dataset.surfaceMode = cachedTheme.surfaceMode;
          }

          if (cachedTheme.contrastMode) {
            root.dataset.contrastMode = cachedTheme.contrastMode;
          }

          if (cachedTheme.themeColor) {
            var themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) {
              themeMeta.setAttribute('content', cachedTheme.themeColor);
            }
          }

          var bg = cachedTheme.cssVars['--theme-bg-rgb'];
          var text = cachedTheme.cssVars['--theme-text-rgb'];
          var muted = cachedTheme.cssVars['--theme-muted-rgb'];
          var accent = cachedTheme.cssVars['--theme-primary-rgb'];

          if (bg) root.style.setProperty('--boot-bg', bg);
          if (text) root.style.setProperty('--boot-text', text);
          if (muted) root.style.setProperty('--boot-muted', muted);
          if (accent) root.style.setProperty('--boot-accent', accent);
        } catch (_) {
          // Keep the static boot palette if cache access fails.
        }
      })();
    </script>

    <style>
      :root {
        --boot-bg: 244 236 227;
        --boot-text: 45 35 31;
        --boot-muted: 120 103 95;
        --boot-accent: 184 95 61;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: rgb(var(--boot-bg));
      }

      #initial-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgb(255 255 255 / 0.72), transparent 34%),
          rgb(var(--boot-bg));
        color: rgb(var(--boot-text));
        opacity: 1;
        transition: opacity 520ms ease, visibility 520ms ease;
      }

      #initial-boot-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(var(--boot-text) / 0.045) 0.7px, transparent 0.7px);
        background-size: 4px 4px;
        opacity: 0.5;
      }

      .app-boot-loader-dismissed #initial-boot-loader {
        visibility: hidden;
        opacity: 0;
      }

      .boot-loader__inner {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 0.85rem;
        padding: 1.6rem;
        text-align: center;
      }

      .boot-loader__brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.68rem, 4.8vw, 3.04rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: 0.08em;
      }

      .boot-loader__label {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgb(var(--boot-muted));
      }

      .boot-loader__bar {
        position: relative;
        width: min(9.6rem, 41.6vw);
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(var(--boot-text) / 0.1);
      }

      .boot-loader__bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: rgb(var(--boot-accent));
        animation: boot-loader-sweep 1.15s ease-in-out infinite;
      }

      @keyframes boot-loader-sweep {
        0% {
          transform: translateX(-115%);
        }

        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader__bar::after {
          animation: none;
          transform: translateX(70%);
        }
      }
    </style>
